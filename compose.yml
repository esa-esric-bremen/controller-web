services:
  controller_dev:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./src:/app/controller/src:rw
      - ./CMakeLists.txt:/app/controller/CMakeLists.txt:rw
      - ./README.md:/app/controller/README.md:rw
      - ./rebuild.bash:/app/controller/rebuild.bash
      - ./data:/app/controller/data:rw
      - ./recordings:/app/controller/recordings:rw
    network_mode: host
